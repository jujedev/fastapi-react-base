server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================
    # 1) BLOQUEAR RUTAS PRIVADAS
    # ============================
    location ~ ^/(dashboard|devices|addDevice|configDevice|typography|color|shadow) {
        return 302 /auth/login;
    }

    # ============================
    # 2) PERMITIR LOGIN
    # ============================
    location /auth/login {
        try_files $uri /index.html;
    }

    # ============================
    # 3) SERVIR LA APP REACT
    # ============================
    location / {
        try_files $uri /index.html;
    }

    # ============================
    # 4) ARCHIVOS ESTÁTICOS (CSS/JS/IMAGES)
    # ============================
    location /static/ {
        try_files $uri =404;
    }

    # ============================
    # 5) API BACKEND (AJUSTAR SI USÁS /api)
    # ============================
    # Si en tu frontend usás /api/ → backend,
    # deja esto activado:
    #
    # location /api/ {
    #     proxy_pass http://energy-backend:8080/api/;
    # }
}